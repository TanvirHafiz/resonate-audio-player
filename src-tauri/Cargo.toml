[package]
name = "resonate"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "resonate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Phase 3+ intelligence layer (feature extraction, mood tagging, affinity
# engine, recommendations) and other advanced/paid-tier functionality lives
# behind this flag. The default (free-tier) build excludes it entirely.
pro = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lofty = "0.25.1"
walkdir = "2.5.0"
rodio = "0.22.2"
once_cell = "1.21.4"
tauri-plugin-dialog = "2.7.3"
ureq = "3.4.1"
rss = "2.1.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
